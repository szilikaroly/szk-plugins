name: selftest

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  selftest:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Slash commands must use the real, namespaced names
        run: |
          # A command is invoked as /<plugin-dir>:<file>, so a short alias like
          # "/sm:context" is a command that does not exist. Emitting one costs a
          # silent no-op at the user's keyboard, which is why this is a hard fail.
          for d in plugins/*/; do
            name="$(basename "$d")"
            if grep -rn --include='*.md' --include='*.py' --include='*.json' \
                 -oE '/[a-z][a-z0-9-]*:[a-z][a-z0-9-]*' "$d" \
               | grep -vE "/(${name}):" \
               | grep -vE 'https?:|/(api|Users|usr|tmp|etc|bin|svg|xml|xlink|w|a|r):' > /tmp/bad.txt; then
              echo "Unknown slash-command namespace in $name (expected /${name}:):"
              cat /tmp/bad.txt
              exit 1
            fi
          done

      - name: Frontmatter of every command must parse
        run: |
          python3 - <<'EOF'
          import pathlib, sys, re
          bad = []
          for p in pathlib.Path('plugins').rglob('commands/*.md'):
              t = p.read_text(encoding='utf-8')
              if not t.startswith('---'):
                  bad.append(f"{p}: no frontmatter"); continue
              fm = t.split('---', 2)[1]
              for line in fm.strip().splitlines():
                  if ':' not in line:
                      continue
                  k, v = line.split(':', 1)
                  v = v.strip()
                  # A value that opens with a quote must also close the whole value.
                  if v[:1] in '"\'' and not (v[-1:] == v[0] and len(v) > 1):
                      bad.append(f"{p}: unquoted continuation in '{k.strip()}'")
          if bad:
              print("\n".join(bad)); sys.exit(1)
          print("frontmatter OK")
          EOF

      - name: Validate every JSON manifest, not just one plugin's
        run: |
          python3 - <<'EOF'
          import json, sys
          from pathlib import Path
          bad = 0
          for p in [Path(".claude-plugin/marketplace.json"),
                    *Path("plugins").glob("*/.claude-plugin/plugin.json"),
                    *Path("plugins").glob("*/hooks/hooks.json")]:
              try:
                  json.loads(p.read_text())
                  print(f"  ok   {p}")
              except Exception as e:
                  print(f"  FAIL {p}: {e}"); bad += 1
          sys.exit(1 if bad else 0)
          EOF

      - name: Compile every plugin's scripts
        run: |
          for d in plugins/*/scripts; do
            [ -d "$d" ] || continue
            echo "== $d"
            python3 -m py_compile "$d"/*.py
          done

      # Every suite, not only memo-guard's. The one bug this file exists to
      # catch — a self test reading the wrong row out of a shared metrics file —
      # passed here for months, because CI leaves MEMO_GUARD_HOME unset and so
      # got a clean sandbox, while every developer machine had the variable
      # pinned to the production store by the plugin's own installer. CI that
      # only ever sees the happy environment is CI that certifies nothing.
      - name: Dependencies the suites need
        run: |
          python3 -m pip install --quiet --upgrade pip
          python3 -m pip install --quiet matplotlib pandas pillow lxml \
                                         python-docx python-pptx

      - name: All plugin self tests
        run: ./bin/selftest-all.sh
