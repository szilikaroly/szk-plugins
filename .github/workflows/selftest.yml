name: selftest

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  selftest:
    runs-on: ${{ matrix.os }}
    # Windows is in the matrix because that is where this plugin broke: the
    # scripts wrote text with the locale encoding, and the first "▸" the
    # compressor printed on a cp1250 machine killed the hook. Nothing about
    # that was visible from ubuntu and macos, which are utf-8 already.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12"]
    # bash on every runner, so the globs below expand the same way. `python`
    # rather than `python3`, which is not a command on a Windows runner.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Validate JSON manifests
        run: |
          python -c "import json;json.load(open('.claude-plugin/marketplace.json'))"
          python -c "import json;json.load(open('plugins/memo-guard/.claude-plugin/plugin.json'))"
          python -c "import json;json.load(open('plugins/memo-guard/hooks/hooks.json'))"
          python -c "import json;json.load(open('plugins/science-monitor/.claude-plugin/plugin.json'))"

      - name: Compile all scripts
        run: python -m py_compile plugins/memo-guard/scripts/*.py plugins/science-monitor/scripts/*.py

      - name: End-to-end selftest (measures the >=95% target)
        env:
          MEMO_GUARD_HOME: ${{ runner.temp }}/mg-test
        run: python plugins/memo-guard/scripts/selftest.py
