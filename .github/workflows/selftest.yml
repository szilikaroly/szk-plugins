name: selftest

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  selftest:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Validate JSON manifests
        run: |
          python3 -c "import json;json.load(open('.claude-plugin/marketplace.json'))"
          python3 -c "import json;json.load(open('plugins/memo-guard/.claude-plugin/plugin.json'))"
          python3 -c "import json;json.load(open('plugins/memo-guard/hooks/hooks.json'))"

      - name: Compile all scripts
        run: python3 -m py_compile plugins/memo-guard/scripts/*.py

      - name: End-to-end selftest (measures the >=95% target)
        env:
          MEMO_GUARD_HOME: ${{ runner.temp }}/mg-test
        run: python3 plugins/memo-guard/scripts/selftest.py
